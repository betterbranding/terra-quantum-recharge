<script>

(function () {

  try {
    var st = document.createElement('style');
    st.id = 'fastSplash';
    st.textContent = 'html{background:#100a18!important}body>*{visibility:hidden!important}' +
      'html::before{content:\"\";position:fixed;inset:0;z-index:2147483646;background-color:#100a18;' +

      'border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:#f0c05a;' +

      '@keyframes fastspin{to{transform:rotate(360deg)}}' +

  } catch (e) {}
  fetch(GH + '/pages/our-doctor.html?v=2').then(function (r) {

    document.open();
    document.write(html);
    document.close();
  }).catch(function (e) {
    var s = document.getElementById('fastSplash');
    if (s && s.parentNode) s.parentNode.removeChild(s);
